name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Giảm hàng đợi FIFO trên shared runners — hủy run cũ cùng branch khi có push mới.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_DB_SYNC: "false"
      NODE_ENV: test
      CI: "true"
      SKIP_API_TEST_BUILD: "1"
      # Runner shared có thể leak OPENAI_API_KEY → chat stream treo vô hạn.
      OPENAI_API_KEY: ""
      TEST_FETCH_TIMEOUT_MS: "45000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Validate Supabase migration names
        run: npm run db:validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: CI_SKIP_VITEST=1 npm run test
