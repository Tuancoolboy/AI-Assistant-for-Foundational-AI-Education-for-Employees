name: CD — Deploy Vercel

on:
  # Chỉ deploy sau khi CI trên main pass.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production (Vercel)
    runs-on: self-hosted
    # Chỉ deploy từ main; workflow_run đã lọc branch main.
    if: >
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    timeout-minutes: 30

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Verify Vercel secrets
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Remote build is intentional: NEXT_PUBLIC_* values must be available
      # while Next.js builds the client bundle. Encrypted Vercel values are not
      # safely materialized by a local/prebuilt build.
      - name: Deploy to production with Vercel remote build
        id: deploy
        run: |
          output="$(npx vercel@54 deploy \
            --prod \
            --format json \
            --skip-domain \
            --yes \
            --token="$VERCEL_TOKEN")"
          printf '%s\n' "$output"

          deployment_url="$(printf '%s' "$output" | node scripts/vercel-cli-json.mjs deployment.url)"
          if [ -z "$deployment_url" ]; then
            echo "::error::Could not parse Vercel deployment URL"
            exit 1
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Assign canonical production alias
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          npx vercel@54 alias set \
            "$DEPLOYMENT_URL" \
            c2-app-009.vercel.app \
            --token="$VERCEL_TOKEN"

          npx vercel@54 alias rm \
            ai-tro-ly.vercel.app \
            --yes \
            --token="$VERCEL_TOKEN" || true
